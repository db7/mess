name: NetBSD (smolBSD)

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  smolbsd:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-s4c/dice/smolbsd-ci:latest
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Tar project
        run: tar cf project.tar .

      - name: Fetch tikl archive
        run: |
          mkdir -p deps
          curl -L --fail --silent --show-error \
            -o deps/tikl-0.4.2.tar.gz \
            https://github.com/db7/tikl/archive/refs/tags/v0.4.2.tar.gz

      - name: Create payload image
        run: .github/smol/scripts/pack-payload.sh payload.img .github/smol/run.sh project.tar deps/tikl-0.4.2.tar.gz

      - name: Boot smolBSD and run tests
        run: .github/smol/scripts/run-payload.sh /smolBSD cicd payload.img

      - name: Collect results
        run: .github/smol/scripts/unpack-payload.sh payload.img results

      - name: List results
        run: ls results

      - name: Ensure tests passed
        run: .github/smol/check-results.sh results
